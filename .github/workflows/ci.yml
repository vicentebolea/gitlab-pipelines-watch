name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e . pytest ruff
      - run: ruff check src --select F,E9
      - run: pytest -q tests

  app-image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: |
          podman build -f Containerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t "$IMAGE:${{ github.sha }}" .
      - name: Push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          podman tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          podman push "$IMAGE:${{ github.sha }}"
          podman push "$IMAGE:latest"
          if [ "${{ github.ref_type }}" = tag ]; then
            podman tag "$IMAGE:${{ github.sha }}" "$IMAGE:${{ github.ref_name }}"
            podman push "$IMAGE:${{ github.ref_name }}"
          fi

  # Drift alarm: the latest published knowledge must fit this build (same embedding
  # model and extraction version). Red after a deliberate EXTRACTION_VERSION bump,
  # until the knowledge repo rebuilds and publishes.
  knowledge-compat:
    needs: app-image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check the published knowledge against this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          # podman run does not pull the source of an image mount
          knowledge=ghcr.io/${{ github.repository_owner }}/vtk-pipelines-knowledge:latest
          podman pull "$knowledge"
          podman run --rm \
            --mount "type=image,source=$knowledge,destination=/kb,rw=true" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}" check
