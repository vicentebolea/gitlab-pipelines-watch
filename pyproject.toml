[project]
name = "pipelines-watch"
version = "0.1.0"
description = "Watch GitLab CI failures via Prometheus and retry the ones an LLM judges transient."
requires-python = ">=3.10"
dependencies = [
    "python-gitlab",
    "prometheus-api-client",
    "prometheus-client",
    "langchain",
    "langchain-chroma",
    "langchain-openai",
    "langchain-ollama",
    "langchain-anthropic",
    "pydantic-settings",
    "aiolimiter",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pipelines-watch = "pipelines_watch.cli:main"

[tool.pytest.ini_options]
markers = ["embedding: needs the real corpus and embedding model (run with -m embedding)"]
addopts = "-m 'not embedding'"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
