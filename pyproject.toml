[project]
name = "pipelines-watch"
version = "0.2.0"
description = "Watch GitLab CI failures via Prometheus and retry the ones an LLM judges transient. Also the shared library (entries, extraction, corpus) for vtk-pipelines-knowledge."
requires-python = ">=3.10"
dependencies = [
    "python-gitlab",
    "prometheus-api-client",
    "prometheus-client",
    "langchain",
    "langchain-chroma",
    "langchain-openai",
    "langchain-ollama",
    "langchain-anthropic",
    "pydantic-settings",
    "aiolimiter",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pipelines-watch = "pipelines_watch.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
